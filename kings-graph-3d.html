<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

    --judah:#2b4c8f;--israel:#a85e2e;--prophet:#b0812f;--person:#7a5aa0;--power:#9c3a2c;--root:#6b6256;
    --right:#4f6b3a;--evil:#a3402f;--mixed:#a9822f;}

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ground);color:var(--ink);font-family:var(--serif);overflow:hidden}
  .app{display:flex;flex-direction:column;height:100vh}

  header{padding:14px 22px 12px;border-bottom:1px solid var(--rule);flex:0 0 auto}
  .eyebrow{font-family:var(--sans);font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 5px}
  header h1{margin:0;font-size:1.4rem;font-weight:600;letter-spacing:.02em}
  header h1 b{color:var(--gold);font-style:italic;font-weight:600}
  header .hint{font-family:var(--sans);font-size:.76rem;color:var(--ink-soft);margin:5px 0 0}

  .stage{flex:1 1 auto;position:relative;overflow:hidden}
  canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas:active{cursor:grabbing}

  /* legend / controls overlay */
  .legend{position:absolute;top:12px;left:12px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;backdrop-filter:blur(4px);max-width:230px;font-family:var(--sans)}
  .legend .lt{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 7px}
  .legend .grp+.grp{margin-top:11px}
  .lrow{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--ink-soft);cursor:pointer;padding:2px 0;user-select:none}
  .lrow input{display:none}
  .lrow .nd{width:12px;height:12px;border-radius:50%;flex:0 0 auto;border:1.5px solid transparent}
  .lrow.off{opacity:.36;text-decoration:line-through}
  .ledge{display:flex;align-items:center;gap:8px;font-size:.74rem;color:var(--ink-soft);padding:1px 0}
  .ln{width:20px;height:0;border-top-width:2.5px;border-top-style:solid;flex:0 0 auto}

  .tools{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .btn{font-family:var(--sans);font-size:.76rem;cursor:pointer;border:1px solid var(--rule);background:color-mix(in srgb,var(--panel) 88%,transparent);color:var(--ink-soft);padding:7px 12px;border-radius:20px;backdrop-filter:blur(4px);transition:.15s}
  .btn:hover{border-color:var(--ink-faint);color:var(--ink)}
  .btn[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* detail panel */
  .detail{position:absolute;left:12px;bottom:12px;width:320px;max-width:calc(100vw - 24px);background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--rule);border-radius:10px;padding:15px 17px;backdrop-filter:blur(6px);box-shadow:0 8px 30px rgba(0,0,0,.18);font-family:var(--sans)}
  .detail .dcat{display:inline-flex;align-items:center;gap:6px;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
  .detail .dcat .dd{width:9px;height:9px;border-radius:50%}
  .detail h3{margin:6px 0 2px;font-family:var(--serif);font-size:1.24rem;font-weight:600}
  .detail .den{font-size:.72rem;color:var(--ink-faint)}
  .detail .verdict{display:inline-block;font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:3px;margin:8px 0 0}
  .v-right{color:var(--right);background:color-mix(in srgb,var(--right) 18%,transparent)}
  .v-evil{color:var(--evil);background:color-mix(in srgb,var(--evil) 18%,transparent)}
  .v-mixed{color:var(--mixed);background:color-mix(in srgb,var(--mixed) 18%,transparent)}
  .detail .note{font-family:var(--serif);font-size:.9rem;color:var(--ink-soft);line-height:1.5;margin:9px 0 0}
  .detail .rels{margin:11px 0 0;border-top:1px solid var(--rule);padding-top:9px}
  .detail .rels .rt{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
  .detail .rel{display:flex;align-items:center;gap:7px;font-size:.8rem;color:var(--ink-soft);padding:2px 0;cursor:pointer;border-radius:4px}
  .detail .rel:hover{color:var(--ink)}
  .detail .rel .rc{width:16px;height:0;border-top-width:2px;border-top-style:solid;flex:0 0 auto}
  .detail .rel .rn{font-weight:600;color:var(--ink)}
  .detail.hint .note{color:var(--ink-faint)}
  .detail .close{position:absolute;top:10px;right:12px;cursor:pointer;color:var(--ink-faint);font-size:1.1rem;line-height:1;border:none;background:none}
  @media (max-width:560px){.legend{max-width:170px;padding:9px 10px}.detail{width:auto;left:8px;right:8px;bottom:8px}}
</style>

    </div>

    <div class="tools">
      <button class="btn" id="reset">重設視角</button>
      <button class="btn" id="rotate" aria-pressed="true">自轉 ⏸</button>
    </div>

    <aside class="detail hint" id="detail">

    </aside>
  </div>
</div>

PROPHETS.forEach(p=>add(p[0],p[1],"prophet",p[2]));
PERSONS.forEach(p=>add(p[0],p[1],"person",p[2]));
POWERS.forEach(p=>add(p[0],p[1],"power",p[2]));

// 補上君王—國度歸屬邊 + 國度—所羅門
const edges=[["solomon","JUD","origin","分國"],["solomon","ISR","origin","分國"]];
JK.forEach(k=>edges.push([k[0],"JUD","mem",""]));
IK.forEach(k=>edges.push([k[0],"ISR","mem",""]));
REL.forEach(e=>edges.push(e));
// 過濾掉指向不存在節點的邊，建立鄰接
const E=edges.filter(e=>byId[e[0]]&&byId[e[1]]).map(e=>({a:byId[e[0]],b:byId[e[1]],t:e[2],rel:e[3]}));
const adj={}; nodes.forEach(n=>adj[n.id]=[]);
E.forEach(e=>{adj[e.a.id].push({o:e.b,t:e.t,rel:e.rel,dir:1});adj[e.b.id].push({o:e.a,t:e.t,rel:e.rel,dir:-1});});

const EDGE_STYLE={
 mem:{c:"rgba(140,128,104,.28)",w:1,dash:0},
 origin:{c:"var(--root)",w:2,dash:0},
 kin:{c:"#c46a9a",w:2,dash:0},
 ally:{c:"#4f7d4a",w:2.4,dash:0},
 kill:{c:"#b8402f",w:2.2,dash:0},
 prophet:{c:"var(--gold)",w:2,dash:6},
 foreign:{c:"#9c3a2c",w:2,dash:6},
};
const REL_LABEL={mem:"屬國",origin:"分國",kin:"婚姻·親屬",ally:"結盟",kill:"弒殺·篡奪",prophet:"先知對王",foreign:"外邦強權"};

/* ───────────── 3D 力導向佈局 ───────────── */
let seed=20260709;
const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
nodes.forEach(n=>{const r=140+rnd()*40,th=rnd()*6.283,ph=Math.acos(2*rnd()-1);
  n.x=r*Math.sin(ph)*Math.cos(th);n.y=r*Math.sin(ph)*Math.sin(th);n.z=r*Math.cos(ph);
  n.vx=n.vy=n.vz=0;n.deg=adj[n.id].length;});
function baseR(n){return n.hub?15:n.cat==="root"?13:n.cat==="power"?12:n.cat==="prophet"?9.5:n.cat==="person"?8.5:8;}

function physics(){
 const KR=3400, KS=0.02, CG=0.006, DMP=0.86;
 for(let i=0;i<nodes.length;i++){const a=nodes[i];if(a.hidden)continue;
   for(let j=i+1;j<nodes.length;j++){const b=nodes[j];if(b.hidden)continue;
     let dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z,d2=dx*dx+dy*dy+dz*dz+.01,d=Math.sqrt(d2);
     const f=KR/d2/d;a.vx+=dx*f;a.vy+=dy*f;a.vz+=dz*f;b.vx-=dx*f;b.vy-=dy*f;b.vz-=dz*f;}}
 E.forEach(e=>{const a=e.a,b=e.b;if(a.hidden||b.hidden)return;
   const rest=e.t==="mem"?58:e.t==="origin"?70:88;
   let dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,d=Math.sqrt(dx*dx+dy*dy+dz*dz)+.01,f=(d-rest)*KS/d;
   a.vx+=dx*f;a.vy+=dy*f;a.vz+=dz*f;b.vx-=dx*f;b.vy-=dy*f;b.vz-=dz*f;});
 nodes.forEach(n=>{if(n.hidden)return;
   n.vx-=n.x*CG;n.vy-=n.y*CG;n.vz-=n.z*CG;
   n.vx*=DMP;n.vy*=DMP;n.vz*=DMP;
   const sp=Math.hypot(n.vx,n.vy,n.vz);if(sp>9){const s=9/sp;n.vx*=s;n.vy*=s;n.vz*=s;}
   n.x+=n.vx;n.y+=n.vy;n.z+=n.vz;});
}

/* ───────────── 畫布 / 相機 ───────────── */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener("resize",resize);

let rotX=-0.35,rotY=0.5,zoom=1;
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||v;}
function col(c){return c.startsWith("var(")?css(c.slice(4,-1)):c;}

let hover=null,selected=null,neighborSet=null;
function computeNeighbors(n){const s=new Set([n.id]);adj[n.id].forEach(a=>s.add(a.o.id));return s;}

function project(){
 const cy=Math.cos(rotY),sy=Math.sin(rotY),cx=Math.cos(rotX),sx=Math.sin(rotX),FOV=780;
 nodes.forEach(n=>{
   const x1=n.x*cy-n.z*sy, z1=n.x*sy+n.z*cy;
   const y2=n.y*cx-z1*sx, z2=n.y*sx+z1*cx;
   const sc=FOV/(FOV-z2)*zoom;
   n.sx=W/2+x1*sc; n.sy=H/2+y2*sc; n.sc=sc; n.zz=z2;
 });
}

function draw(){
 ctx.clearRect(0,0,W,H);
 const ink=col("var(--ink)"),faint=col("var(--ink-faint)");
 // edges
 E.forEach(e=>{
   if(e.a.hidden||e.b.hidden)return;
   const st=EDGE_STYLE[e.t];
   let alpha=1, w=st.w;
   const active = selected? (neighborSet.has(e.a.id)&&neighborSet.has(e.b.id)) : true;
   if(selected&&!active)alpha=e.t==="mem"?0.04:0.07;
   else if(!selected&&e.t==="mem")alpha=1;
   const depth=(e.a.zz+e.b.zz)/2, da=Math.max(.25,Math.min(1,(depth+260)/520));
   ctx.globalAlpha=alpha*da;
   ctx.strokeStyle=col(st.c);ctx.lineWidth=w*(0.6+0.5*da);
   ctx.setLineDash(st.dash?[st.dash,st.dash]:[]);
   ctx.beginPath();ctx.moveTo(e.a.sx,e.a.sy);ctx.lineTo(e.b.sx,e.b.sy);ctx.stroke();
 });
 ctx.setLineDash([]);ctx.globalAlpha=1;
 // nodes back-to-front
 const order=nodes.filter(n=>!n.hidden).sort((a,b)=>a.zz-b.zz);
 order.forEach(n=>{
   const r=baseR(n)*n.sc*0.55;
   const dimmed = selected && !neighborSet.has(n.id);
   const da=Math.max(.3,Math.min(1,(n.zz+260)/520));
   ctx.globalAlpha=(dimmed?0.18:1)*da;
   // verdict ring for kings
   if(n.v){ctx.beginPath();ctx.arc(n.sx,n.sy,r+3,0,6.2832);ctx.fillStyle=col(VCOL[n.v]);ctx.fill();}
   ctx.beginPath();ctx.arc(n.sx,n.sy,r,0,6.2832);
   ctx.fillStyle=col(CAT[n.cat]);ctx.fill();
   if(n===hover||n===selected){ctx.globalAlpha=da;ctx.lineWidth=2;ctx.strokeStyle=col("var(--gold)");ctx.stroke();}
   // labels: hubs/powers/prophets/persons/root always; kings when hover/selected/neighbor
   const showLabel = n.hub||n.cat==="root"||n.cat==="power"||n.cat==="prophet"||n.cat==="person"
     || n===hover||n===selected|| (selected&&neighborSet.has(n.id));
   if(showLabel && !dimmed){
     ctx.globalAlpha=da;
     const fs=Math.max(10,(n.hub?14:11)*Math.min(1.15,n.sc));
     ctx.font=`600 ${fs}px var(--serif),serif`;
     ctx.textAlign="center";ctx.textBaseline="top";
     ctx.lineWidth=3;ctx.strokeStyle=col("var(--ground)");
     ctx.strokeText(n.label,n.sx,n.sy+r+2);
     ctx.fillStyle=(n===hover||n===selected)?col("var(--gold)"):ink;
     ctx.fillText(n.label,n.sx,n.sy+r+2);
   }
 });
 ctx.globalAlpha=1;
}

/* ───────────── 主迴圈 ───────────── */
let autoRotate=true,dragging=false;
function loop(){
 for(let k=0;k<2;k++)physics();
 if(autoRotate&&!dragging&&!selected&&!reduce)rotY+=0.0016;
 project();draw();
 requestAnimationFrame(loop);
}
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

/* ───────────── 互動 ───────────── */
let px=0,py=0,moved=0,downTime=0;
function pick(mx,my){let best=null,bd=1e9;nodes.forEach(n=>{if(n.hidden)return;const r=baseR(n)*n.sc*0.55+6,d=Math.hypot(n.sx-mx,n.sy-my);if(d<r&&d<bd){bd=d;best=n;}});return best;}
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);dragging=true;px=e.clientX;py=e.clientY;moved=0;});
cv.addEventListener("pointermove",e=>{
 const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
 if(dragging){const dx=e.clientX-px,dy=e.clientY-py;moved+=Math.abs(dx)+Math.abs(dy);
   rotY+=dx*0.008;rotX+=dy*0.008;rotX=Math.max(-1.4,Math.min(1.4,rotX));px=e.clientX;py=e.clientY;}
 else{const h=pick(mx,my);if(h!==hover){hover=h;cv.style.cursor=h?"pointer":"grab";if(h&&!selected)showDetail(h,true);}}
});
cv.addEventListener("pointerup",e=>{dragging=false;
 if(moved<5){const r=cv.getBoundingClientRect();const n=pick(e.clientX-r.left,e.clientY-r.top);
   if(n){selectNode(n);}else{clearSel();}}
});
cv.addEventListener("wheel",e=>{e.preventDefault();zoom*=e.deltaY<0?1.1:0.9;zoom=Math.max(0.4,Math.min(3.2,zoom));},{passive:false});

function selectNode(n){selected=n;neighborSet=computeNeighbors(n);showDetail(n,false);}
function clearSel(){selected=null;neighborSet=null;hintDetail();}

/* ───────────── 詳情面板 ───────────── */
const detail=document.getElementById("detail");
function catName(c){return {judah:"猶大 · 南國",israel:"以色列 · 北國",prophet:"先知",person:"關鍵人物",power:"外邦強權",root:"分國之源"}[c];}
function vName(v){return {right:"行耶和華眼中看為正",evil:"行耶和華眼中看為惡",mixed:"行正，但有虧欠"}[v];}
function showDetail(n,isHover){
 detail.classList.remove("hint");
 const rels=adj[n.id].filter(a=>!a.o.hidden);
 rels.sort((a,b)=>a.t.localeCompare(b.t));
 const relHtml=rels.map(a=>{const st=EDGE_STYLE[a.t];
   return `<div class="rel" data-go="${a.o.id}"><span class="rc" style="border-color:${col(st.c)};${st.dash?'border-top-style:dashed;':''}"></span>
     <span class="rn">${a.o.label}</span><span style="color:var(--ink-faint);font-size:.72rem">${a.rel||REL_LABEL[a.t]}</span></div>`;}).join("");
 detail.innerHTML=`
   ${isHover?'':'<button class="close" aria-label="關閉">×</button>'}
   <span class="dcat"><span class="dd" style="background:${col(CAT[n.cat])}"></span>${catName(n.cat)}</span>
   <h3>${n.label}</h3>
   ${n.v?`<span class="verdict v-${n.v}">${vName(n.v)}</span>`:""}
   <p class="note">${n.note}</p>
   ${rels.length?`<div class="rels"><div class="rt">關係 · ${rels.length}</div>${relHtml}</div>`:""}`;
 const c=detail.querySelector(".close");if(c)c.onclick=clearSel;
 detail.querySelectorAll(".rel").forEach(el=>el.onclick=()=>{const t=byId[el.dataset.go];if(t)selectNode(t);});
}
function hintDetail(){detail.classList.add("hint");
 detail.innerHTML=`<p class="note">點選任一個節點，這裡會顯示他的身分、重點事蹟（含耶和華看為罪的事），以及與其他人物的關係。也可從關係清單點進相連的人物。</p>`;}

/* ───────────── 控制項 ───────────── */
document.getElementById("reset").onclick=()=>{rotX=-0.35;rotY=0.5;zoom=1;clearSel();};
const rotBtn=document.getElementById("rotate");
rotBtn.onclick=()=>{autoRotate=!autoRotate;rotBtn.setAttribute("aria-pressed",autoRotate);rotBtn.textContent=autoRotate?"自轉 ⏸":"自轉 ▶";};
document.querySelectorAll(".lrow").forEach(row=>{
 row.addEventListener("click",e=>{e.preventDefault();const cat=row.dataset.cat,on=row.classList.toggle("off");
   nodes.forEach(n=>{if(n.cat===cat&&!n.hub)n.hidden=!!on;});
   if(selected&&selected.hidden)clearSel();});
});

resize();hintDetail();loop();
</script>
